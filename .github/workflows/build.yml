name: Build A17 Remote GPU

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS application
        run: |
          xcodebuild \
            -project A17RemoteGPU.xcodeproj \
            -scheme A17RemoteGPU \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/A17RemoteGPU.app Payload/
          zip -r A17RemoteGPU-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: A17RemoteGPU
          path: A17RemoteGPU-unsigned.ipa
