      - name: Build iOS application
        run: |
          set -o pipefail

          xcodebuild \
            -project A17RemoteGPU.xcodeproj \
            -scheme A17RemoteGPU \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Show compiler errors
        if: always()
        run: |
          echo "===== ERRORS ====="
          grep -n -B 5 -A 12 "error:" build.log || true

          echo "===== WARNINGS ====="
          grep -n -B 2 -A 5 "warning:" build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A17RemoteGPU-build-log
          path: build.log
          if-no-files-found: ignore
